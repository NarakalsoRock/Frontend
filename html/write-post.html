<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineX - 글쓰기</title>
    <link rel="stylesheet" href="../css/pages/write-post.css">
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">CineX</a>
        <div class="search-container">
            <input type="text" class="search-input" placeholder="제목, 사람, 장르">
            <button type="button" class="search-button" aria-label="검색">
                <svg class="search-icon" viewBox="0 0 24 24">
                    <path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
            </button>
        </div>
        <nav class="nav">
            <a href="index.html" class="nav-item">Home</a>
            <a href="now-playing.html" class="nav-item">Now playing</a>
            <a href="upcoming.html" class="nav-item">Upcoming</a>
            <a href="community.html" class="nav-item">Community</a>
            <a href="mypage.html" class="nav-item">My page</a>
        </nav>
    </header>

    <main class="write-post-content">
        <div class="write-post-header">
            <h1 class="write-post-title">글쓰기</h1>
        </div>

        <form class="write-form" id="writeForm">
            <div class="form-group">
                <label for="postTitle" class="form-label">제목</label>
                <input type="text" id="postTitle" class="form-input" placeholder="제목을 입력하세요" required>
            </div>

            <div class="form-group">
                <label for="postContent" class="form-label">내용</label>
                <textarea id="postContent" class="form-textarea" placeholder="내용을 입력하세요" required></textarea>
            </div>

            <div class="button-group">
                <button type="submit" class="submit-button">등록하기</button>
                <button type="button" class="cancel-button" onclick="history.back()">취소</button>
            </div>
        </form>
    </main>

    <footer class="footer">
        <div class="footer-text">© 2025 CineX. All rights reserved.</div>
    </footer>

    <script>
        // URL 파라미터에서 게시판 타입을 가져와서 제목 업데이트
        window.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const boardType = urlParams.get('type');
            const writePostTitle = document.querySelector('.write-post-title');
            
            if (boardType === 'info') {
                document.title = 'CineX - 정보 게시판 글쓰기';
                writePostTitle.textContent = '정보 게시판 글쓰기';
            } else if (boardType === 'review') {
                document.title = 'CineX - 리뷰 게시판 글쓰기';
                writePostTitle.textContent = '리뷰 게시판 글쓰기';
            } else if (boardType === 'discussion') {
                document.title = 'CineX - 토론 게시판 글쓰기';
                writePostTitle.textContent = '토론 게시판 글쓰기';
            }

            // 폼 제출 이벤트 처리
            document.getElementById('writeForm').addEventListener('submit', function(e) {
                e.preventDefault();
                // 여기에 폼 제출 처리 로직 추가
                // 실제로는 서버로 데이터를 전송하고 응답을 처리해야 합니다
                history.back(); // 임시로 이전 페이지로 돌아가기
            });
        });
    </script>
</body>
</html>
