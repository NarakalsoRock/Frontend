<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineX - Upcoming Movies</title>
    <link rel="stylesheet" href="../css/pages/upcoming.css">
</head>
<body>
    <header class="header">
        <div class="logo">CineX</div>
        <nav class="nav">
            <a href="index.html" class="nav-item">Home</a>
            <a href="now-playing.html" class="nav-item">Now playing</a>
            <a href="upcoming.html" class="nav-item active">Upcoming</a>
            <a href="mypage.html" class="nav-item">My page</a>
        </nav>
    </header>

    <section class="filter-section">
        <div class="filter-container">
            <div class="filter-tabs">
                <button class="filter-tab active">상영 예정작</button>
            </div>
            <div class="sort-dropdown">
                <button class="sort-button">개봉일순 ▼</button>
                <div class="sort-options">
                    <button class="sort-option">개봉일순</button>
                    <button class="sort-option">관람등급</button>
                    <button class="sort-option">장르별</button>
                </div>
            </div>
        </div>
    </section>

    <section class="movies-section">
        <div class="movies-container">
            <div class="movie-grid">
                <!-- 영화 목록이 여기에 동적으로 추가됩니다 -->
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="footer-text">© 2025 CineX. All rights reserved.</div>
    </footer>

    <!-- API 및 페이지 스크립트 -->
    <script src="../js/api.js"></script>
    <script src="../js/upcoming.js"></script>
</body>
</html>
