<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineX - 게시판</title>
    <link rel="stylesheet" href="../css/pages/board.css">
    <script src="../js/api.js" defer></script>
    <style>
        /* 아이콘 버튼 공통 스타일 */
        .back-button, .back-to-community-button { /* 클래스명 통일 또는 개별 적용 */
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            color: #fff;
            text-decoration: none;
            margin-right: 10px;
            background: none;
            border: none;
            cursor: pointer;
        }
        .arrow-icon { /* SVG 아이콘 공통 스타일 */
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
        .board-title-row {
            display: flex;
            align-items: center;
        }
        .board-title {
            font-size: 1.8em;
            font-weight: bold;
            color: #fff; /* board.css에서 #673AB7 로 되어있으므로, 일관성을 위해 CSS 파일에서 최종 관리 */
            margin: 0;
            line-height: normal;
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">CineX</a>
        <div class="header-search-container">
            <input type="text" class="header-search-input" placeholder="제목, 사람, 장르">
            <button type="button" class="header-search-button" aria-label="검색">
                <svg class="header-search-icon" viewBox="0 0 24 24">
                    <path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
            </button>
        </div>
        <nav class="nav">
            <a href="index.html" class="nav-item">Home</a>
            <a href="now-playing.html" class="nav-item">Now playing</a>
            <a href="upcoming.html" class="nav-item">Upcoming</a>
            <a href="community.html" class="nav-item active">Community</a>
            <a href="mypage.html" class="nav-item">My page</a>
        </nav>
    </header>

    <main class="board-main-content">
        <div class="board-header">
            <div class="board-title-row">
                <a href="community.html?tab=board" class="back-button" aria-label="커뮤니티 홈으로 돌아가기">
                    <svg class="arrow-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
                    </svg>
                </a>
                <h1 class="board-title"></h1> 
                <div class="board-buttons">
                    <a href="write-post.html" class="write-button" id="writeButton">
                        <svg class="button-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
                        </svg>
                        글쓰기
                    </a>
                    
                </div>
            </div>
            <p class="board-description">영화에 대한 다양한 이야기를 나누는 공간입니다.</p>
        </div>

        <div class="post-list" id="postList">
            </div>
        <div class="pagination" id="pagination">
            </div>
    </main>

    <footer class="footer">
        <div class="footer-text">© 2025 CineX. All rights reserved.</div>
    </footer>

    <script>
        let currentPage = 1;
        let boardType;

        function formatDate(dateString) {
            const date = new Date(dateString);
            return `${date.getFullYear()}.${String(date.getMonth() + 1).padStart(2, '0')}.${String(date.getDate()).padStart(2, '0')}`;
        }

        async function loadPosts(type, page = 1) {
            const postListContainer = document.getElementById('postList');
            const paginationContainer = document.getElementById('pagination');
            postListContainer.innerHTML = '<p class="loading-message">게시글을 불러오는 중입니다...</p>';
            paginationContainer.innerHTML = '';

            try {
                const response = await window.getPosts(type, page);
                if (response.success && response.data) {
                    postListContainer.innerHTML = '';
                    if (response.data.length === 0) {
                        postListContainer.innerHTML = '<p class="no-posts-message">등록된 게시글이 없습니다.</p>';
                    } else {
                        response.data.forEach(post => {
                            const postCard = document.createElement('a');
                            postCard.href = `post-detail.html?id=${post._id}&type=${type}`;
                            postCard.className = 'post-card';
                            postCard.innerHTML = `
                                <div class="post-header">
                                    <h2 class="post-title">${post.title}</h2>
                                    <span class="post-date">${formatDate(post.createdAt)}</span>
                                </div>
                                <p class="post-preview">${post.content.substring(0, 100)}${post.content.length > 100 ? '...' : ''}</p>
                                <div class="post-footer">
                                    <div class="post-meta">
                                        <span>조회 ${post.views || 0}</span>
                                    </div>
                                    <div class="post-meta">
                                        <span>좋아요 ${post.likes ? post.likes.length : 0}</span>
                                    </div>
                                    <div class="post-meta">
                                        <span>댓글 ${post.commentsCount || 0}</span>
                                    </div>
                                </div>
                            `;
                            postListContainer.appendChild(postCard);
                        });
                    }
                    renderPagination(response.totalPages, response.currentPage, type);
                } else {
                    postListContainer.innerHTML = '<p class="error-message">게시글을 불러오는데 실패했습니다.</p>';
                    console.error('게시글 로드 실패:', response.error);
                }
            } catch (error) {
                postListContainer.innerHTML = '<p class="error-message">게시글을 불러오는데 오류가 발생했습니다.</p>';
                console.error('게시글 로드 중 오류:', error);
            }
        }

        function renderPagination(totalPages, currentPageNum, type) {
            const paginationContainer = document.getElementById('pagination');
            paginationContainer.innerHTML = '';
            if (totalPages <= 1) return;

            for (let i = 1; i <= totalPages; i++) {
                const pageButton = document.createElement('button');
                pageButton.textContent = i;
                pageButton.className = 'page-button';
                if (i === currentPageNum) {
                    pageButton.classList.add('active');
                }
                pageButton.addEventListener('click', () => {
                    currentPage = i;
                    loadPosts(type, currentPage);
                });
                paginationContainer.appendChild(pageButton);
            }
        }

        window.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            boardType = urlParams.get('type');
            const boardTitleElement = document.querySelector('.board-title'); 
            const boardDescriptionElement = document.querySelector('.board-description');
            const writeButton = document.getElementById('writeButton');
            const backButtonIcon = document.querySelector('.back-button .arrow-icon');

            if (backButtonIcon) {
                // 커뮤니티 홈으로 돌아가는 버튼이므로 왼쪽 화살표. SVG path d가 오른쪽을 가리키므로 반전.
                backButtonIcon.style.transform = 'scaleX(-1)';
            }

            let boardName = '';
            let pageDocTitle = 'CineX - 게시판';

            if (boardType) {
                writeButton.href = `write-post.html?type=${boardType}`;
                 switch (boardType) {
                    case 'info':
                        boardName = '정보 게시판';
                        pageDocTitle = 'CineX - 정보 게시판';
                        boardDescriptionElement.textContent = '영화 관련 최신 소식, 흥미로운 사실, 개봉 예정작 정보, 이벤트 소식 등 다양한 정보성 콘텐츠를 공유하고 얻을 수 있는 커뮤니티 공간입니다.';
                        break;
                    case 'review':
                        boardName = '리뷰 게시판';
                        pageDocTitle = 'CineX - 리뷰 게시판';
                        boardDescriptionElement.textContent = '영화에 대한 개인적인 감상, 평가, 비평 등을 자유롭게 작성하고 공유하며, 다른 사용자들의 다양한 의견을 탐색하고 소통할 수 있도록 설계된 커뮤니티 공간입니다.';
                        break;
                    case 'discussion':
                        boardName = '토론 게시판';
                        pageDocTitle = 'CineX - 토론 게시판';
                        boardDescriptionElement.textContent = '특정 영화나 영화 관련 주제에 대해 사용자들이 자유롭게 의견을 교환하고, 심층적인 논의를 펼칠 수 있도록 설계된 커뮤니티 공간입니다.';
                        break;
                    default:
                        boardName = '알 수 없는 게시판';
                        pageDocTitle = 'CineX - 알 수 없는 게시판';
                        boardDescriptionElement.textContent = '잘못된 접근입니다. 커뮤니티 페이지로 돌아가주세요.';
                        document.getElementById('postList').innerHTML = '<p class="error-message">유효하지 않은 게시판 타입입니다.</p>';
                        boardTitleElement.textContent = boardName;
                        document.title = pageDocTitle;
                        return; 
                }
                boardTitleElement.textContent = boardName; 
                document.title = pageDocTitle;

                const pageParam = urlParams.get('page');
                currentPage = pageParam ? parseInt(pageParam, 10) : 1;
                loadPosts(boardType, currentPage);
            } else {
                boardTitleElement.textContent = '게시판 타입을 찾을 수 없습니다.';
                boardDescriptionElement.textContent = '올바른 경로로 접근해주세요.';
                document.getElementById('postList').innerHTML = '<p class="error-message">게시판 타입을 URL에 지정해주세요. (예: ?type=info)</p>';
                 document.title = 'CineX - 오류';
            }
        });
    </script>
</body>
</html>
