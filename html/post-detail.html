<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineX - 게시글</title>
    <link rel="stylesheet" href="../css/pages/post-detail.css">
    <script src="../js/api.js" defer></script>
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">CineX</a>
        <div class="header-search-container">
            <input type="text" class="header-search-input" placeholder="제목, 사람, 장르">
            <button type="button" class="header-search-button" aria-label="검색">
                <svg class="header-search-icon" viewBox="0 0 24 24">
                    <path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
            </button>
        </div>
        <nav class="nav">
            <a href="index.html" class="nav-item">Home</a>
            <a href="now-playing.html" class="nav-item">Now playing</a>
            <a href="upcoming.html" class="nav-item">Upcoming</a>
            <a href="community.html" class="nav-item active">Community</a>
            <a href="mypage.html" class="nav-item">My page</a>
        </nav>
    </header>

    <main class="post-detail-content">
        <div class="post-navigation">
            <!-- <a href="#" id="backToBoardButton" class="back-button" aria-label="게시판으로 돌아가기">&lt;</a> -->
            <button class="back-button" onclick="location.href='board.html'" aria-label="게시판으로 돌아가기">&lt;</button>
            <h2 class="board-title-display">게시판</h2>
        </div>

        <article class="post-header-container">
            <h1 class="post-title-main"></h1>
            <div class="post-info">
                <div class="post-author">
                    <div class="author-avatar">
                        <svg viewBox="0 0 24 24" fill="none">
                            <path d="M12 12C14.21 12 16 10.21 16 8C16 5.79 14.21 4 12 4C9.79 4 8 5.79 8 8C8 10.21 9.79 12 12 12ZM12 14C9.33 14 4 15.34 4 18V20H20V18C20 15.34 14.67 14 12 14Z" fill="white"/>
                        </svg>
                    </div>
                    <span class="author-name"></span>
                </div>
                <time class="post-date" datetime=""></time>
            </div>
            <div class="post-stats">
                <span>조회 <span id="viewCount">0</span></span>
            </div>
        </article>

        <div class="post-content-main">
        </div>

        <div class="post-actions">
            <button class="action-button" id="likeButton">
                <svg class="button-icon" viewBox="0 0 24 24">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
                좋아요 <span id="likeCount">0</span>
            </button>
            <button class="action-button" id="commentScrollButton">
                <svg class="button-icon" viewBox="0 0 24 24">
                    <path d="M21 15a2 2 0 0 1-2 2h-2v3l-4-3H7a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8z"/>
                </svg>
                댓글 <span id="commentCountDisplay">0</span>
            </button>
        </div>

        <section class="comments-section">
            <h3 class="comments-title">댓글 <span id="totalCommentCount"></span></h3>
            <form class="comment-form" id="commentForm">
                <textarea class="comment-input" id="commentInputContent" placeholder="댓글을 입력하세요" required></textarea>
                <button type="submit" class="submit-comment">댓글 작성</button>
            </form>

            <div class="comment-list" id="commentList">
            </div>
             <div class="pagination" id="commentPagination">
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-text">© 2025 CineX. All rights reserved.</div>
    </footer>

    <script>
        // 이전 스크립트 내용과 대부분 동일하게 유지 (formatDate, nl2br, loadPostDetails, loadComments, renderCommentPagination, 좋아요/댓글 이벤트 리스너)
        let currentPostId;
        let currentBoardType; // 게시글의 boardType을 저장할 변수
        let currentCommentPage = 1;
        let currentUser = null;

        function formatDate(dateString) {
            const options = { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' };
            return new Date(dateString).toLocaleString('ko-KR', options);
        }

        function nl2br(str) {
            return str ? str.replace(/(\r\n|\n\r|\r|\n)/g, "<br>") : "";
        }

        async function loadPostDetails(postId) {
            const boardTitleDisplay = document.querySelector('.board-title-display');
            const postTitleMain = document.querySelector('.post-title-main');
            const authorName = document.querySelector('.author-name');
            const postDate = document.querySelector('.post-date');
            const viewCount = document.getElementById('viewCount');
            const postContentMain = document.querySelector('.post-content-main');
            const likeCountSpan = document.getElementById('likeCount');
            const likeButton = document.getElementById('likeButton');
            const commentCountDisplay = document.getElementById('commentCountDisplay');
            const backToBoardButton = document.getElementById('backToBoardButton');


            try {
                const response = await window.getPostDetails(postId); // api.js
                if (response.success && response.data) {
                    const post = response.data;
                    currentBoardType = post.boardType; // 현재 게시글의 boardType 저장

                    // 이전 버튼 링크 설정
                    if(backToBoardButton) {
                        backToBoardButton.href = `board.html?type=${currentBoardType}`;
                    }


                    document.title = `CineX - ${post.title}`;
                    let boardName = '';
                    switch(post.boardType) {
                        case 'info': boardName = '정보 게시판'; break;
                        case 'review': boardName = '리뷰 게시판'; break;
                        case 'discussion': boardName = '토론 게시판'; break;
                        default: boardName = '게시판';
                    }
                    boardTitleDisplay.textContent = boardName;

                    postTitleMain.textContent = post.title;
                    authorName.textContent = post.username || '익명';
                    postDate.textContent = formatDate(post.createdAt);
                    postDate.setAttribute('datetime', post.createdAt);
                    viewCount.textContent = post.views || 0;
                    postContentMain.innerHTML = nl2br(post.content);

                    likeCountSpan.textContent = post.likes ? post.likes.length : 0;
                    commentCountDisplay.textContent = post.commentsCount || 0;
                    document.getElementById('totalCommentCount').textContent = `(${(post.commentsCount || 0)})`;


                    if (currentUser && post.likes && post.likes.includes(currentUser._id)) {
                        likeButton.classList.add('active');
                    } else {
                        likeButton.classList.remove('active');
                    }
                    loadComments(postId);
                } else {
                    postContentMain.innerHTML = `<p class="error-message">게시글을 불러오는데 실패했습니다: ${response.error || '알 수 없는 오류'}</p>`;
                }
            } catch (error) {
                postContentMain.innerHTML = `<p class="error-message">게시글을 불러오는데 오류가 발생했습니다: ${error.message}</p>`;
            }
        }

        // loadComments, renderCommentPagination, 좋아요/댓글 이벤트 리스너는 이전과 동일하게 유지
        async function loadComments(postId, page = 1) {
            const commentListContainer = document.getElementById('commentList');
            const commentPaginationContainer = document.getElementById('commentPagination');
            commentListContainer.innerHTML = '<p class="loading-message">댓글을 불러오는 중입니다...</p>';
            commentPaginationContainer.innerHTML = '';

            try {
                const response = await window.getComments(postId, page);
                if (response.success && response.data) {
                    commentListContainer.innerHTML = '';
                    if (response.data.length === 0) {
                        commentListContainer.innerHTML = '<p class="no-comments-message">등록된 댓글이 없습니다.</p>';
                    } else {
                        response.data.forEach(comment => {
                            const commentDiv = document.createElement('div');
                            commentDiv.className = 'comment';
                            commentDiv.innerHTML = `
                                <div class="comment-header">
                                    <div class="author-avatar">
                                        <svg viewBox="0 0 24 24" fill="none"><path d="M12 12C14.21 12 16 10.21 16 8C16 5.79 14.21 4 12 4C9.79 4 8 5.79 8 8C8 10.21 9.79 12 12 12ZM12 14C9.33 14 4 15.34 4 18V20H20V18C20 15.34 14.67 14 12 14Z" fill="currentColor"/></svg>
                                    </div>
                                    <span class="comment-author">${comment.username || '익명'}</span>
                                    <time class="comment-date" datetime="${comment.createdAt}">${formatDate(comment.createdAt)}</time>
                                </div>
                                <p class="comment-text">${nl2br(comment.content)}</p>
                            `;
                            commentListContainer.appendChild(commentDiv);
                        });
                    }
                    renderCommentPagination(response.totalPages, response.currentPage, postId);
                    const totalCommentsCount = response.totalComments || 0;
                    document.getElementById('totalCommentCount').textContent = `(${totalCommentsCount})`;
                     document.getElementById('commentCountDisplay').textContent = totalCommentsCount;
                } else {
                     commentListContainer.innerHTML = `<p class="error-message">댓글을 불러오는데 실패했습니다: ${response.error || '알 수 없는 오류'}</p>`;
                }
            } catch (error) {
                 commentListContainer.innerHTML = `<p class="error-message">댓글을 불러오는데 오류가 발생했습니다: ${error.message}</p>`;
            }
        }

        function renderCommentPagination(totalPages, currentPageNum, postId) {
            const paginationContainer = document.getElementById('commentPagination');
            paginationContainer.innerHTML = ''; 
            if (totalPages <= 1) return;

            for (let i = 1; i <= totalPages; i++) {
                const pageButton = document.createElement('button');
                pageButton.textContent = i;
                pageButton.className = 'page-button';
                if (i === currentPageNum) {
                    pageButton.classList.add('active');
                }
                pageButton.addEventListener('click', () => {
                    currentCommentPage = i;
                    loadComments(postId, currentCommentPage);
                });
                paginationContainer.appendChild(pageButton);
            }
        }

        document.getElementById('likeButton').addEventListener('click', async function() {
            if (!currentUser) { 
                alert('좋아요를 표시하려면 로그인이 필요합니다.');
                localStorage.setItem('redirectAfterLogin', window.location.href);
                window.location.href = 'login.html';
                return;
            }
            try {
                const response = await window.togglePostLike(currentPostId);
                if (response && response.success) {
                    document.getElementById('likeCount').textContent = response.data.likesCount;
                    this.classList.toggle('active', response.data.isLiked);
                } else if (response === null) {
                    // 로그인 리다이렉션 처리됨
                } else {
                    alert(response ? response.error : '좋아요 처리에 실패했습니다.');
                }
            } catch (error) {
                // 에러 처리됨
            }
        });

        document.getElementById('commentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            if (!currentUser) {
                alert('댓글을 작성하려면 로그인이 필요합니다.');
                localStorage.setItem('redirectAfterLogin', window.location.href);
                window.location.href = 'login.html';
                return;
            }
            const textarea = document.getElementById('commentInputContent');
            const commentText = textarea.value.trim();
            if (commentText) {
                try {
                    const response = await window.createComment(currentPostId, commentText);
                    if (response && response.success) {
                        textarea.value = '';
                        currentCommentPage = 1;
                        loadComments(currentPostId, currentCommentPage); 
                    } else if (response === null) {
                        // 로그인 리다이렉션 처리됨
                    } else {
                        alert(response ? response.error : '댓글 작성에 실패했습니다.');
                    }
                } catch (error) {
                    // 에러 처리됨
                }
            }
        });

        document.getElementById('commentScrollButton').addEventListener('click', function() {
            document.getElementById('commentInputContent').scrollIntoView({ behavior: 'smooth' });
            document.getElementById('commentInputContent').focus();
        });

        window.addEventListener('DOMContentLoaded', async function() {
            currentUser = await window.getCurrentUser(); 

            const urlParams = new URLSearchParams(window.location.search);
            currentPostId = urlParams.get('id');
            // type 파라미터는 게시글 상세 정보에 currentBoardType으로 저장되므로, 여기서 따로 저장할 필요는 없음

            if (currentPostId) {
                await loadPostDetails(currentPostId);
            } else {
                document.querySelector('.post-detail-content').innerHTML = '<p class="error-message">게시글 ID가 올바르지 않습니다.</p>';
            }
        });
    </script>
</body>
</html>
