<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineX - 큐레이션 만들기</title>
    <link rel="stylesheet" href="../css/pages/create-curation.css">
</head>
<body>
    <header class="header">
        <a href="../html/index.html" class="logo">CineX</a>
        <div class="header-search-container">
            <input type="text" class="header-search-input" placeholder="제목, 사람, 장르">
            <button type="button" class="header-search-button" aria-label="검색">
                <svg class="header-search-icon" viewBox="0 0 24 24">
                    <path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
            </button>
        </div>
        <nav class="nav">
            <a href="../html/index.html" class="nav-item">Home</a>
            <a href="../html/now-playing.html" class="nav-item">Now playing</a>
            <a href="../html/upcoming.html" class="nav-item">Upcoming</a>
            <a href="../html/community.html" class="nav-item">Community</a>
            <a href="../html/mypage.html" class="nav-item">My page</a>
        </nav>
    </header>

    <main class="create-curation-main-content">
        <div class="divider"></div>

        <section class="curation-input-section">
            <div class="input-group">
                <h2 class="input-label">제목을 입력하세요.</h2>
                <input type="text" class="text-input title-input" placeholder="제목을 입력하세요.">
            </div>

            <div class="input-group">
                <h2 class="input-label">영화를 선택하세요.</h2>
                <div class="movie-select-area">
                    <div class="selected-movies-carousel">
                        <img src="../assets/images/akira.jpg" alt="AKIRA" class="selected-movie-poster">
                        <img src="../assets/images/dead-pool.jpg" alt="데드풀" class="selected-movie-poster">
                        <img src="../assets/images/ghost.jpg" alt="공각기동대" class="selected-movie-poster">
                        <img src="../assets/images/jujutsu.jpg" alt="주술회전" class="selected-movie-poster">
                    </div>
                    <button class="select-movie-button">
                        <div class="search-icon"></div>
                    </button>
                </div>
            </div>

            <div class="divider"></div>

            <div class="input-group">
                <h2 class="input-label">설명을 입력하세요.</h2>
                <textarea class="text-input description-textarea" placeholder="내용을 입력하세요. (0/1000)" maxlength="1000"></textarea>
            </div>
        </section>

        <div class="complete-button-container">
            <button class="complete-button">완료</button>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-text">© 2025 CineX. All rights reserved.</div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 설명 글자 수 카운트
            const descriptionTextarea = document.querySelector('.description-textarea');
            
            descriptionTextarea.addEventListener('input', function() {
                const length = this.value.length;
                this.placeholder = `내용을 입력하세요. (${length}/1000)`;
            });

            // 완료 버튼 클릭 시 커뮤니티 페이지의 큐레이션 탭으로 이동
            const completeButton = document.querySelector('.complete-button');
            completeButton.addEventListener('click', function() {
                // 커뮤니티 페이지로 이동하면서 큐레이션 탭을 활성화하기 위한 쿼리 파라미터 추가
                window.location.href = '../html/community.html?tab=curation';
            });
        });
    </script>
    <script src="../js/header.js"></script>
</body>
</html>
