<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineX</title>
    <link rel="stylesheet" href="../css/pages/index.css">
</head>
<body>
    <header class="header">
        <div class="logo">CineX</div>
        <nav class="nav">
            <a href="index.html" class="nav-item active">Home</a> 
            <a href="now-playing.html" class="nav-item">Now playing</a>
            <a href="upcoming.html" class="nav-item">Upcoming</a>
            <a href="mypage.html" class="nav-item">My page</a>
        </nav>
    </header>

    <section class="main-movie">
        <div class="main-movie-content">
            <h1 class="main-movie-title"></h1>
            <div class="main-movie-info">
                <span class="movie-rating"></span>
                <span class="movie-runtime"></span>
                <span class="movie-release"></span>
                <span class="movie-vote"></span>
            </div>
            <div class="movie-genres"></div>
            <p class="main-movie-description"></p>
            <div class="movie-director"></div>
            <div class="main-movie-buttons">
                <button class="btn-detail">상세보기</button>
                <button class="btn-trailer">예고편 보기</button>
            </div>
        </div>
    </section>

    <section class="movie-section now-playing">
        <div class="section-header">
            <h2 class="section-title">Now Playing</h2>
            <div class="section-header">
                <a href="now-playing.html" class="arrow">&gt;</a>
            </div>
        </div>
        <div class="movie-grid">
            <div class="movie-item">
                <img src="https://placehold.co/150x220" alt="썬더볼츠" class="movie-poster">
                <div class="movie-title">썬더볼츠</div>
            </div>
            <div class="movie-item">
                <img src="https://placehold.co/150x220" alt="진격의 거인" class="movie-poster">
                <div class="movie-title">진격의 거인</div>
            </div>
            <div class="movie-item">
                <img src="https://placehold.co/150x220" alt="AKIRA" class="movie-poster">
                <div class="movie-title">AKIRA</div>
            </div>
            <div class="movie-item">
                <img src="https://placehold.co/150x220" alt="카우보이 비밥" class="movie-poster">
                <div class="movie-title">카우보이 비밥</div>
            </div>
            <div class="movie-item">
                <img src="https://placehold.co/150x220" alt="Devil May Cry" class="movie-poster">
                <div class="movie-title">Devil May Cry</div>
            </div>
            <div class="movie-item">
                <img src="https://placehold.co/150x220" alt="Solo Leveling" class="movie-poster">
                <div class="movie-title">Solo Leveling</div>
            </div>
            <div class="movie-item">
                <img src="https://placehold.co/150x220" alt="귀멸의 칼날" class="movie-poster">
                <div class="movie-title">귀멸의 칼날</div>
            </div>
            <div class="movie-item">
                <img src="https://placehold.co/150x220" alt="스즈메의 문단속" class="movie-poster">
                <div class="movie-title">스즈메의 문단속</div>
            </div>
            <div class="movie-item">
                <img src="https://placehold.co/150x220" alt="너의 이름은" class="movie-poster">
                <div class="movie-title">너의 이름은</div>
            </div>
            <div class="movie-item">
                <img src="https://placehold.co/150x220" alt="날씨의 아이" class="movie-poster">
                <div class="movie-title">날씨의 아이</div>
            </div>
        </div>
    </section>

    <section class="movie-section coming-soon">
        <div class="section-header">
            <h2 class="section-title">Coming Soon</h2>
            <div class="section-header">
                <a href="upcoming.html" class="arrow">&gt;</a>

        </div>
        <div class="movie-grid">

    <footer class="footer">
        <div class="footer-text">© 2025 CineX. All rights reserved.</div>
    </footer>

</body>
</html>
