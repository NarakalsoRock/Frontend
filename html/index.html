<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineX</title>
    <link rel="stylesheet" href="/css/pages/index.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo">CineX</div>
        <nav class="nav">
            <a href="#" class="nav-item">Home</a>
            <a href="#" class="nav-item">Now playing</a>
            <a href="#" class="nav-item">Upcoming</a>
            <a href="#" class="nav-item">My page</a>
        </nav>
    </header>

    <!-- Main Movie Section -->
    <section class="main-movie">
        <h1 class="main-movie-title">Main Movie</h1>
        <p class="main-movie-description">This section is description of main movie.</p>
        <div class="main-movie-buttons">
            <button class="btn-detail">상세보기</button>
            <button class="btn-trailer">예고편 보기</button>
        </div>
    </section>

    <!-- Now Playing Section -->
    <section class="movie-section now-playing">
        <div class="section-header">
            <h2 class="section-title">Now Playing</h2>
            <div class="arrow">></div>
        </div>
        <div class="movie-grid">
            <div class="movie-item">
                <img src="https://placehold.co/153x220" alt="썬더볼츠" class="movie-poster">
                <div class="movie-title">썬더볼츠</div>
            </div>
            <div class="movie-item">
                <img src="https://placehold.co/155x220" alt="진격의 거인 The Last Attack" class="movie-poster">
                <div class="movie-title">진격의 거인 The Last Attack</div>
            </div>
            <div class="movie-item">
                <img src="https://placehold.co/154x220" alt="AKIRA" class="movie-poster">
                <div class="movie-title">AKIRA</div>
            </div>
            <div class="movie-item">
                <img src="https://placehold.co/168x220" alt="카우보이 비밥" class="movie-poster">
                <div class="movie-title">카우보이 비밥</div>
            </div>
            <div class="movie-item">
                <img src="https://placehold.co/176x220" alt="Devil may cry" class="movie-poster">
                <div class="movie-title">Devil may cry</div>
            </div>
            <div class="movie-item">
                <img src="https://placehold.co/158x224" alt="Solo Leveling" class="movie-poster">
                <div class="movie-title">Solo Leveling</div>
            </div>
        </div>
    </section>

    <!-- Coming Soon Section -->
    <section class="movie-section coming-soon">
        <div class="section-header">
            <h2 class="section-title">Coming Soon</h2>
            <div class="arrow">></div>
        </div>
        <div class="movie-grid">
            <div class="movie-item">
                <img src="https://placehold.co/153x220" alt="Coming Soon Movie 1" class="movie-poster">
            </div>
            <div class="movie-item">
                <img src="https://placehold.co/153x220" alt="Coming Soon Movie 2" class="movie-poster">
            </div>
            <div class="movie-item">
                <img src="https://placehold.co/153x220" alt="Coming Soon Movie 3" class="movie-poster">
            </div>
            <div class="movie-item">
                <img src="https://placehold.co/153x220" alt="Coming Soon Movie 4" class="movie-poster">
            </div>
            <div class="movie-item">
                <img src="https://placehold.co/153x220" alt="Coming Soon Movie 5" class="movie-poster">
            </div>
            <div class="movie-item">
                <img src="https://placehold.co/153x220" alt="Coming Soon Movie 6" class="movie-poster">
            </div>
            <div class="movie-item">
                <img src="https://placehold.co/153x220" alt="Coming Soon Movie 7" class="movie-poster">
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-text">© 2025 CineX. All rights reserved.</div>
    </footer>
</body>
</html>
