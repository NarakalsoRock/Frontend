<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineX - 제작진 및 출연진</title>
    <link rel="stylesheet" href="../css/pages/film-crew.css">
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">CineX</a>
        <div class="header-search-container">
            <input type="text" class="header-search-input" placeholder="제목, 사람, 장르">
            <button type="button" class="header-search-button" aria-label="검색">
                <svg class="header-search-icon" viewBox="0 0 24 24">
                    <path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
            </button>
        </div>
        <nav class="nav">
            <a href="index.html" class="nav-item">Home</a>
            <a href="now-playing.html" class="nav-item">Now playing</a>
            <a href="upcoming.html" class="nav-item">Upcoming</a>
            <a href="community.html" class="nav-item">Community</a>
            <a href="mypage.html" class="nav-item">My page</a>
        </nav>
    </header>

    <div class="film-crew-page-container">

        <div class="crew-main-title">제작진</div>
        <div class="crew-category-title category-script">각본</div>
        <div class="crew-category-title category-director">감독</div>
        <div class="crew-category-title category-direction">연출(2)</div>
        <div class="crew-category-title category-sound">음향(2)</div>

        <div class="crew-list">
            <div class="person-item person-item-crew-1">
                <div class="person-image-placeholder"></div>
                <div class="person-name">이사야마 하지메</div>
            </div>
            <div class="person-item person-item-crew-2">
                <div class="person-image-placeholder"></div>
                <div class="person-name">카지 유우키</div>
            </div>
            <div class="person-item person-item-crew-3">
                <div class="person-image-placeholder"></div>
                <div class="person-name">이시키와 유이</div>
            </div>
            <div class="person-item person-item-crew-4">
                <div class="person-image-placeholder"></div>
                <div class="person-name">카미야 히로시</div>
            </div>
            <div class="person-item person-item-crew-5">
                <div class="person-image-placeholder"></div>
                <div class="person-name">박로미</div>
            </div>
        </div>

        <div class="cast-main-title">출연진</div>

        <div class="cast-list">
            <div class="person-item person-item-cast-1">
                <div class="person-image-placeholder"></div>
                <div class="person-role-title">에렌 예거</div>
                <div class="person-name">카지 유우키</div>
            </div>
            <div class="person-item person-item-cast-2">
                <div class="person-image-placeholder"></div>
                <div class="person-role-title">미카사 아커만</div>
                <div class="person-name">이시카와 유이</div>
            </div>
            <div class="person-item person-item-cast-3">
                <div class="person-image-placeholder"></div>
                <div class="person-role-title">아르민 알레르토</div>
                <div class="person-name">이노우에 마리나</div>
            </div>
            <div class="person-item person-item-cast-4">
                <div class="person-image-placeholder"></div>
                <div class="person-role-title">리바이 아커만</div>
                <div class="person-name">카미야 히로시</div>
            </div>
            <div class="person-item person-item-cast-5">
                <div class="person-image-placeholder"></div>
                <div class="person-role-title">한지 조에</div>
                <div class="person-name">박로미</div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-text">© 2025 CineX. All rights reserved.</div>
    </footer>
    <script src="../js/header.js"></script>
</body>
</html>
