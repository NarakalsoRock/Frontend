<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineX - 영화 상세</title>
    <link rel="stylesheet" href="../css/pages/movie-detail.css">
    <!-- API 통신을 위한 fetch 유틸리티 함수들 -->
    <script src="../js/api.js" defer></script>
    <script src="../js/movie-detail.js" defer></script>
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">CineX</a>
        <div class="header-search-container">
            <input type="text" class="header-search-input" placeholder="제목, 사람, 장르">
            <button type="button" class="header-search-button" aria-label="검색">
                <svg class="header-search-icon" viewBox="0 0 24 24">
                    <path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
            </button>
        </div>
        <nav class="nav">
            <a href="index.html" class="nav-item">Home</a>
            <a href="now-playing.html" class="nav-item">Now playing</a>
            <a href="upcoming.html" class="nav-item">Upcoming</a>
            <a href="community.html" class="nav-item">Community</a>
            <a href="mypage.html" class="nav-item">My page</a>
        </nav>
    </header>

    <main class="main-content">
        <section class="movie-detail">
            <!-- 로딩 인디케이터 -->
            <div class="loading-indicator" style="display: none;">
                <div class="spinner"></div>
                <p>영화 정보를 불러오는 중...</p>
            </div>

            <!-- 에러 메시지 -->
            <div class="error-message" style="display: none;">
                <p>죄송합니다. 영화 정보를 불러오는 중 오류가 발생했습니다.</p>
                <p>잠시 후 다시 시도해 주세요.</p>
            </div>

            <div class="movie-header">
                <div class="poster-container">
                    <img src="" alt="" class="movie-poster" loading="lazy">
                    <div class="pin-container">
                        <!-- 핀 포인트는 동적으로 추가됩니다 -->
                    </div>
                </div>
                <div class="movie-info">
                    <h1 class="movie-title"></h1>
                    <div class="movie-meta"></div>
                    <div class="action-buttons">
                        <button class="btn-like" aria-label="좋아요">
                            <svg class="icon-heart" viewBox="0 0 24 24">
                                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                            </svg>
                        </button>
                        <button class="btn-bookmark" aria-label="북마크">
                            <svg class="icon-bookmark" viewBox="0 0 24 24">
                                <path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/>
                            </svg>
                        </button>
                        <button class="btn-trailer" aria-label="예고편 재생">
                            <svg class="icon-play" viewBox="0 0 24 24">
                                <path d="M8 5v14l11-7z"/>
                            </svg>
                            <span>예고편 재생</span>
                        </button>
                    </div>
                    <section class="movie-synopsis">
                        <h2 class="section-title">개요</h2>
                        <p class="synopsis-text"></p>
                    </section>
                </div>
            </div>

            <section class="movie-credits">
                <div class="section-header">
                    <h2 class="section-title">제작진 및 출연자</h2>
                </div>
                <div class="credits-scroll-wrapper">
                    <div class="credits-scroll">
                        <!-- 제작진 및 출연자는 동적으로 추가됩니다 -->
                    </div>
                </div>
            </section>

            <section class="movie-media">
                <div class="section-header">
                    <div class="section-title media-section-title">
                        <a href="#" class="media-link">미디어</a>
                    </div>
                    <div class="media-tabs">
                        <button class="media-tab active" data-tab="trailers">동영상/트레일러</button>
                        <button class="media-tab" data-tab="stills">포스터/스틸컷</button>
                    </div>
                </div>
                <div class="media-content" id="trailers">
                    <div class="media-grid video-grid">
                        <!-- 트레일러는 동적으로 추가됩니다 -->
                    </div>
                </div>
                <div class="media-content hidden" id="stills">
                    <div class="media-stills-scroll-wrapper">
                        <div class="media-stills-scroll">
                            <!-- 스틸컷은 동적으로 추가됩니다 -->
                        </div>
                        <button class="media-scroll-more-btn" aria-label="미디어 페이지로 이동">&gt;</button>
                    </div>
                </div>
            </section>

            <section class="related-series">
                <h2 class="section-title">관련 시리즈</h2>
                <div class="related-series-banner">
                    <h3 class="related-series-banner-title"></h3>
                    <p class="related-series-list"></p>
                    <button class="btn-view-collection">컬렉션 보기</button>
                </div>
            </section>

            <section class="recommended-movies">
                <div class="section-header">
                    <h2 class="section-title">추천 영화</h2>
                </div>
                <div class="movie-grid">
                    <!-- 추천 영화는 동적으로 추가됩니다 -->
                </div>
            </section>

            <!-- 예고편 모달 -->
            <div class="trailer-modal" id="trailerModal">
                <div class="modal-content">
                    <button class="modal-close">&times;</button>
                    <div class="video-container">
                        <iframe src="" frameborder="0" allowfullscreen></iframe>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-text">© 2025 CineX. All rights reserved.</div>
    </footer>
</body>
</html>
