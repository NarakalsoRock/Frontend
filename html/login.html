<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineX - 로그인</title>
    <link rel="stylesheet" href="../css/pages/login.css">
</head>
<body>
    <header class="header">
        <div class="logo">CineX</div>
        <nav class="nav">
            <a href="index.html" class="nav-item">Home</a> 
            <a href="now-playing.html" class="nav-item">Now playing</a>
            <a href="upcoming.html" class="nav-item">Upcoming</a>
            <a href="mypage.html" class="nav-item">My page</a>
        </nav>
    </header>

    <div class="container">
        <div class="login-box">
            <h2 class="login-title">로그인</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail" class="input-label">이메일</label>
                    <input type="email" id="loginEmail" class="input-field" required placeholder="이메일을 입력하세요">
                </div>
                <div class="form-group">
                    <label for="loginPassword" class="input-label">비밀번호</label>
                    <input type="password" id="loginPassword" class="input-field" required placeholder="비밀번호를 입력하세요">
                </div>
                <div class="signup-prompt">
                    <span class="signup-text">아직 회원이 아니신가요?</span>
                    <a href="signup.html" class="signup-link">회원가입</a>
                </div>
                <button type="submit" class="login-button" id="loginBtn">로그인</button>
            </form>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-text">© 2025 CineX. All rights reserved.</div>
    </footer>

    <!-- API 및 페이지 스크립트 -->
    <script src="../js/api.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
