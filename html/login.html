<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineX - 로그인</title>
    <link rel="stylesheet" href="../css/pages/login.css">
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">CineX</a>
        <div class="header-search-container">
            <input type="text" class="header-search-input" placeholder="제목, 사람, 장르">
            <button type="button" class="header-search-button" aria-label="검색">
                <svg class="header-search-icon" viewBox="0 0 24 24">
                    <path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
            </button>
        </div>
        <nav class="nav">
            <a href="index.html" class="nav-item">Home</a>
            <a href="now-playing.html" class="nav-item">Now playing</a>
            <a href="upcoming.html" class="nav-item">Upcoming</a>
            <a href="community.html" class="nav-item">Community</a>
            <a href="mypage.html" class="nav-item">My page</a>
        </nav>
    </header>

    <div class="container">
        <div class="login-box">
            <h2 class="login-title">로그인</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail" class="input-label">이메일</label>
                    <input type="email" id="loginEmail" class="input-field" required placeholder="이메일을 입력하세요">
                </div>
                <div class="form-group">
                    <label for="loginPassword" class="input-label">비밀번호</label>
                    <input type="password" id="loginPassword" class="input-field" required placeholder="비밀번호를 입력하세요">
                </div>
                <div class="signup-prompt">
                    <span class="signup-text">아직 회원이 아니신가요?</span>
                    <a href="signup.html" class="signup-link">회원가입</a>
                </div>
                <button type="submit" class="login-button" id="loginBtn">로그인</button>
            </form>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-text">© 2025 CineX. All rights reserved.</div>
    </footer>

    <!-- API 및 페이지 스크립트 -->
    <script src="../js/api.js"></script>
    <script src="../js/login.js"></script>
    <script src="../js/header.js"></script>
</body>
</html>
